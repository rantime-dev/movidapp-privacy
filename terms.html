    function setLang(lang) {
      const data = translations[lang] || translations.it;
      document.getElementById('title').innerText = data.title;
      document.getElementById('lastUpdated').innerText = data.lastUpdated;
      document.getElementById('content').innerHTML = data.content;
      document.documentElement.lang = lang;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      try {
        const url = new URL(window.location);
        url.searchParams.set('lang', lang);
        window.history.replaceState({}, '', url);
      } catch (e) {}
    }

    const params = new URLSearchParams(window.location.search);
    const requestedLang = params.get('lang');
    const browserLang = (navigator.language || navigator.userLanguage || '').substring(0, 2).toLowerCase();

    if (requestedLang && translations[requestedLang]) {
      setLang(requestedLang);
    } else if (browserLang && translations[browserLang]) {
      setLang(browserLang);
    } else {
      setLang('it');
    }
  </script>
